<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque - 542 jeux</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #24272b;
      --bg-sidebar: #1e2022;
      --bg-header: #24272b;
      --text-primary: #f2f2f2;
      --text-secondary: #909497;
      --text-muted: #5e6266;
      --accent-purple: #7240f2;
      --hover-bg: #2d3136;
      --card-radius: 4px;
      --sidebar-width: 260px;
      --green: #78ffa0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1a1c1d;
      padding-top: 15px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0 20px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.2px;
    }

    .user-profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-image: url('https://avatars.akamai.steamstatic.com/7b1b115be6ac4ded1bbfff20010da104ce6a55e1_full.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .user-profile::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 8px;
      height: 8px;
      background: #43b581;
      border: 2px solid var(--bg-sidebar);
      border-radius: 50%;
    }

    .sidebar-title {
      font-size: 10px;
      color: #5e6266;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 0 24px 8px 24px;
      font-weight: 700;
    }

    .sidebar-nav {
      list-style: none;
      margin-bottom: 14px;
    }

    .nav-item {
      padding: 7px 24px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #909497;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
    }

    .nav-item:hover {
      color: #f2f2f2;
      background-color: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      color: #ececec;
      background-color: rgba(255, 255, 255, 0.06);
      font-weight: 500;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: var(--accent-purple);
    }

    .nav-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-count {
      margin-left: auto;
      font-size: 10px;
      color: #5e6266;
      font-weight: 500;
    }

    .stats-panel {
      margin-top: auto;
      padding: 16px 20px 18px 20px;
      border-top: 1px solid #1a1c1d;
      background: #1b1d20;
    }

    .stats-title {
      font-size: 10px;
      color: #5e6266;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .stat-label {
      color: var(--text-secondary);
    }

    .stat-value {
      color: #b3a4ff;
      font-weight: 600;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(to bottom, #2c3036, #1e2024);
    }

    .header {
      height: 68px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      background-color: transparent;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 68px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .breadcrumb-item.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .breadcrumb-count {
      color: var(--text-muted);
      font-weight: 500;
    }


    .search-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .search-wrapper {
      position: relative;
    }

    .search-bar {
      background-color: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 7px 12px 7px 35px;
      border-radius: 4px;
      width: 220px;
      color: white;
      font-size: 12px;
      transition: all 0.2s;
    }

    .search-bar:focus {
      outline: none;
      background-color: rgba(0, 0, 0, 0.25);
      border-color: var(--accent-purple);
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .game-grid-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px 25px 40px 25px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-gap: 20px;
    }

    .game-card {
      aspect-ratio: 0.69;
      background-color: #2a2d32;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .game-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-radius: var(--card-radius);
      transition: border-color 0.25s;
      pointer-events: none;
    }

    .game-card:hover::after {
      border-color: var(--accent-purple);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-card .title-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 10px 10px 10px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      color: white;
      font-size: 11px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-card:hover .title-overlay {
      opacity: 1;
    }

    .price-text {
      color: var(--green);
      font-weight: 600;
      font-size: 10px;
    }

    .no-results {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden { display: none !important; }

    .game-grid-container::-webkit-scrollbar {
      width: 6px;
    }

    .game-grid-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .game-grid-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .game-grid-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      body { display: block; height: auto; }
      .main-content { min-height: 100vh; }
      .search-bar:focus { width: 220px; }
    }
  </style>
</head>

    let currentSort = 'name';

    function parsePrice(p) {
      if (!p) return 0;
      return parseFloat(p.replace(/[~€\s]/g, '').replace(',', '.')) || 0;
    }

    function updateStats(list) {
      const prices = list.map(g => parsePrice(g.price)).filter(p => p > 0);
      const sum = prices.reduce((a, b) => a + b, 0);
      const avg = prices.length ? sum / prices.length : 0;
      const min = prices.length ? Math.min(...prices) : 0;
      const max = prices.length ? Math.max(...prices) : 0;
      document.getElementById('total-games').textContent = list.length;
      document.getElementById('total-price').textContent = sum.toFixed(0) + ' €';
      document.getElementById('avg-price').textContent = avg.toFixed(0) + ' €';
      document.getElementById('min-price').textContent = min.toFixed(0) + ' €';
      document.getElementById('max-price').textContent = max.toFixed(0) + ' €';
      document.getElementById('nav-count').textContent = list.length;
      document.getElementById('showing-count').textContent = list.length;
    }

    function sortGames(list) {
      return [...list].sort((a, b) => {
        if (currentSort === 'name') return (a.name || '').localeCompare(b.name || '');
        if (currentSort === 'price-asc') return parsePrice(a.price) - parsePrice(b.price);
        return parsePrice(b.price) - parsePrice(a.price);
      });
    }

    function esc(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function render(filter) {
      let list = games.filter(g => g.name);
      if (filter) {
        const q = filter.toLowerCase();
        list = list.filter(g => g.name.toLowerCase().includes(q));
      }
      const sorted = sortGames(list);
      updateStats(sorted);

      const grid = document.getElementById('grid-view');
      const noRes = document.getElementById('no-results');

      if (!sorted.length) {
        grid.innerHTML = '';
        noRes.classList.remove('hidden');
        return;
      }
      noRes.classList.add('hidden');

      grid.innerHTML = sorted.map(g =>
        '<a class="game-card" href="'+esc(g.url)+'" target="_blank" rel="noopener">' +
        '<img src="'+esc(g.image)+'" alt="'+esc(g.name)+'" loading="lazy">' +
        '<div class="title-overlay">' +
        '<div class="title-text">'+esc(g.name)+'</div>' +
        '<div class="price-text">'+esc(g.price||'N/A')+'</div>' +
        '</div></a>'
      ).join('');
    }

    render('');

    document.getElementById('search').addEventListener('input', e => render(e.target.value));

    document.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        render(document.getElementById('search').value);
      });
    });
  </script>
