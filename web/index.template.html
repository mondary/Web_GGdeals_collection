<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bibliothèque</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #24272b;
      --bg-sidebar: #1e2022;
      --bg-header: #24272b;
      --text-primary: #f2f2f2;
      --text-secondary: #909497;
      --text-muted: #5e6266;
      --accent-purple: #7240f2;
      --hover-bg: #2d3136;
      --card-radius: 4px;
      --sidebar-width: 260px;
      --green: #78ffa0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-sidebar);
      display: flex;
      flex-direction: column;
      border-right: 1px solid #1a1c1d;
      padding-top: 15px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 0 20px 20px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .user-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-primary);
      letter-spacing: 0.2px;
    }

    .user-profile {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-image: url('https://avatars.akamai.steamstatic.com/7b1b115be6ac4ded1bbfff20010da104ce6a55e1_full.jpg');
      background-size: cover;
      background-position: center;
      position: relative;
    }

    .user-profile::after {
      content: '';
      position: absolute;
      bottom: 0;
      right: 0;
      width: 8px;
      height: 8px;
      background: #43b581;
      border: 2px solid var(--bg-sidebar);
      border-radius: 50%;
    }

    .sidebar-title {
      font-size: 10px;
      color: #5e6266;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      padding: 0 24px 8px 24px;
      font-weight: 700;
    }

    .sidebar-nav {
      list-style: none;
      margin-bottom: 14px;
    }

    .nav-item {
      padding: 7px 24px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #909497;
      cursor: pointer;
      transition: all 0.1s ease;
      position: relative;
    }

    .nav-item:hover {
      color: #f2f2f2;
      background-color: rgba(255, 255, 255, 0.04);
    }

    .nav-item.active {
      color: #ececec;
      background-color: rgba(255, 255, 255, 0.06);
      font-weight: 500;
    }

    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background-color: var(--accent-purple);
    }

    .nav-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .item-count {
      margin-left: auto;
      font-size: 10px;
      color: #5e6266;
      font-weight: 500;
    }

    .stats-panel {
      margin-top: auto;
      padding: 16px 20px 18px 20px;
      border-top: 1px solid #1a1c1d;
      background: #1b1d20;
    }

    #platform-list {
      max-height: none;
      overflow: visible;
      padding-right: 0;
    }

    #launcher-list {
      max-height: 200px;
      overflow: auto;
      padding-right: 4px;
    }

    .platform-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      cursor: pointer;
    }

    .platform-item input {
      accent-color: var(--accent-purple);
    }

    .launcher-item label {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      cursor: pointer;
    }

    .launcher-item input {
      accent-color: var(--accent-purple);
    }

    .stats-title {
      font-size: 10px;
      color: #5e6266;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      font-size: 12px;
    }

    .stat-label {
      color: var(--text-secondary);
    }

    .stat-value {
      color: #b3a4ff;
      font-weight: 600;
    }

    .main-content {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: linear-gradient(to bottom, #2c3036, #1e2024);
    }

    .header {
      height: 68px;
      padding: 0 25px;
      display: flex;
      align-items: center;
      background-color: transparent;
      position: relative;
      z-index: 10;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      min-height: 68px;
    }

    .breadcrumbs {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }

    .breadcrumb-item.active {
      color: var(--text-primary);
      font-weight: 600;
    }

    .breadcrumb-count {
      color: var(--text-muted);
      font-weight: 500;
    }


    .search-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-right {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-secondary);
      font-size: 12px;
    }

    .cols-label {
      letter-spacing: 0.2px;
    }

    .cols-range {
      width: 120px;
      accent-color: var(--accent-purple);
    }

    .search-wrapper {
      position: relative;
    }

    .search-bar {
      background-color: rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 7px 12px 7px 35px;
      border-radius: 4px;
      width: 220px;
      color: white;
      font-size: 12px;
      transition: all 0.2s;
    }

    .search-bar:focus {
      outline: none;
      background-color: rgba(0, 0, 0, 0.25);
      border-color: var(--accent-purple);
      width: 220px;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .game-grid-container {
      flex-grow: 1;
      overflow-y: auto;
      padding: 10px 25px 40px 25px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      grid-gap: 20px;
    }

    .game-card {
      aspect-ratio: 0.69;
      background-color: #2a2d32;
      border-radius: var(--card-radius);
      overflow: hidden;
      position: relative;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.25s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .game-card:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
      z-index: 2;
    }

    .game-card::after {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid transparent;
      border-radius: var(--card-radius);
      transition: border-color 0.25s;
      pointer-events: none;
    }

    .game-card:hover::after {
      border-color: var(--accent-purple);
    }

    .game-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .game-card .title-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 10px 10px 10px;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.9), transparent);
      color: white;
      font-size: 11px;
      font-weight: 600;
      opacity: 1;
      transition: opacity 0.2s, background 0.2s;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .game-card:hover .title-overlay {
      background: linear-gradient(to top, rgba(0, 0, 0, 0.95), rgba(0, 0, 0, 0.2));
    }

    .price-text {
      color: var(--green);
      font-weight: 600;
      font-size: 10px;
    }

    .launcher-row {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
    }

    .launcher-icon {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      background: #444;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .launcher-icon svg {
      width: 12px;
      height: 12px;
      display: block;
      fill: currentColor;
    }

    .launcher-icon[data-l="steam"] { background: #1b2838; }
    .launcher-icon[data-l="ea"] { background: #c43c3c; }
    .launcher-icon[data-l="ubisoft"] { background: #1a5fb4; }
    .launcher-icon[data-l="gog"] { background: #7b2cbf; }
    .launcher-icon[data-l="epic"] { background: #111; }
    .launcher-icon[data-l="microsoft"] { background: #107c10; }
    .launcher-icon[data-l="battlenet"] { background: #00aeff; }
    .launcher-icon[data-l="rockstar"] { background: #f2a900; color: #111; }
    .launcher-icon[data-l="prime"] { background: #00a8e1; }
    .launcher-icon[data-l="itch"] { background: #fa5c5c; }
    .launcher-icon[data-l="drmfree"] { background: #666; }
    .launcher-icon[data-l="other"] { background: #555; }

    .no-results {
      text-align: center;
      padding: 60px 24px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .hidden { display: none !important; }

    .game-grid-container::-webkit-scrollbar {
      width: 6px;
    }

    .game-grid-container::-webkit-scrollbar-track {
      background: transparent;
    }

    .game-grid-container::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }

    .game-grid-container::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    @media (max-width: 900px) {
      .sidebar { display: none; }
      body { display: block; height: auto; }
      .main-content { min-height: 100vh; }
      .search-bar:focus { width: 220px; }
    }
  </style>
  <!-- DRM_SPRITE_PLACEHOLDER -->
</head>
<body>
  <aside class="sidebar">
    <div class="sidebar-header">
      <div class="user-info">
        <div class="user-profile"></div>
        <div class="user-name">pouark</div>
      </div>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-title">BIBLIOTHÈQUE</h3>
      <ul class="sidebar-nav">
        <li class="nav-item active" data-tab="collection">
          Tous mes jeux
          <span class="item-count" id="collection-count">0</span>
        </li>
        <li class="nav-item" data-tab="wishlist">
          Wishlist
          <span class="item-count" id="wishlist-count">0</span>
        </li>
      </ul>
    </div>

    <div class="sidebar-section">
      <h3 class="sidebar-title">TRIER PAR</h3>
      <ul class="sidebar-nav">
        <li class="nav-item active" data-sort="name">Nom A-Z</li>
        <li class="nav-item" data-sort="price-asc">Prix ↑</li>
        <li class="nav-item" data-sort="price-desc">Prix ↓</li>
      </ul>
    </div>

    <div class="sidebar-section" id="launchers-section">
      <h3 class="sidebar-title">LAUNCHERS</h3>
      <ul class="sidebar-nav" id="launcher-list"></ul>
    </div>

    <div class="sidebar-section" id="platforms-section">
      <h3 class="sidebar-title">PLATEFORMES</h3>
      <ul class="sidebar-nav" id="platform-list"></ul>
    </div>

    <div class="stats-panel">
      <div class="stats-title">Stats</div>
      <div class="stat-row">
        <span class="stat-label">Jeux</span>
        <span class="stat-value" id="total-games">0</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Valeur</span>
        <span class="stat-value" id="total-price">0 €</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Moyenne</span>
        <span class="stat-value" id="avg-price">0 €</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Min</span>
        <span class="stat-value" id="min-price">0 €</span>
      </div>
      <div class="stat-row">
        <span class="stat-label">Max</span>
        <span class="stat-value" id="max-price">0 €</span>
      </div>
    </div>
  </aside>

  <main class="main-content">
    <header class="header">
      <div class="breadcrumbs">
        <div class="breadcrumb-item active" id="breadcrumb-label">Tous mes jeux</div>
        <div class="breadcrumb-count"><span id="showing-count">0</span></div>
      </div>
      <div class="search-container">
        <div class="search-wrapper">
          <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2.5">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-bar" id="search" placeholder="Recherche">
        </div>
      </div>
      <div class="header-right">
        <span class="cols-label">Colonnes</span>
        <input class="cols-range" id="cols-range" type="range" min="4" max="20" value="12">
        <span id="cols-value">12</span>
      </div>
    </header>

    <div class="game-grid-container">
      <div class="game-grid" id="grid-view"></div>
      <div class="no-results hidden" id="no-results">Aucun jeu trouvé</div>
    </div>
  </main>

  <script>
    const collection = __COLLECTION_DATA__;
    const wishlist = __WISHLIST_DATA__;
    const DRM_SPRITE_PATH = '';
    const USE_SVG_LAUNCHERS = true;
    function normalizeList(list) {
      const seen = new Map();
      for (const g of (list || [])) {
        if (!g) continue;
        const url = (g.url || '').trim().toLowerCase();
        const name = (g.name || '').trim().toLowerCase();
        const key = url || name;
        if (!key) continue;
        if (!seen.has(key)) seen.set(key, g);
      }
      return [...seen.values()];
    }

    const datasets = {
      collection: normalizeList(collection),
      wishlist: normalizeList(wishlist)
    };
    const tabLabels = { collection: 'Tous mes jeux', wishlist: 'Wishlist' };
    let currentTab = 'collection';
    let currentSort = 'name';
    const activePlatforms = new Set();
    const activeLaunchers = new Set();

    function parsePrice(p) {
      if (!p) return 0;
      return parseFloat(p.replace(/[~€\s]/g, '').replace(',', '.')) || 0;
    }

    function updateStats(list) {
      const prices = list.map(g => parsePrice(g.price)).filter(p => p > 0);
      const sum = prices.reduce((a, b) => a + b, 0);
      const avg = prices.length ? sum / prices.length : 0;
      const min = prices.length ? Math.min(...prices) : 0;
      const max = prices.length ? Math.max(...prices) : 0;
      document.getElementById('total-games').textContent = list.length;
      document.getElementById('total-price').textContent = sum.toFixed(0) + ' €';
      document.getElementById('avg-price').textContent = avg.toFixed(0) + ' €';
      document.getElementById('min-price').textContent = min.toFixed(0) + ' €';
      document.getElementById('max-price').textContent = max.toFixed(0) + ' €';
      document.getElementById('showing-count').textContent = list.length;
    }

    function sortGames(list) {
      return [...list].sort((a, b) => {
        if (currentSort === 'name') return (a.name || '').localeCompare(b.name || '');
        if (currentSort === 'price-asc') return parsePrice(a.price) - parsePrice(b.price);
        return parsePrice(b.price) - parsePrice(a.price);
      });
    }

    function esc(s) {
      if (!s) return '';
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');
    }

    function normalizePlatform(p) {
      return String(p || "").trim().toLowerCase();
    }

    function platformLabel(p) {
      const s = String(p || "").trim();
      if (!s) return "";
      if (s.length <= 3) return s.toUpperCase();
      return s.replace(/[-_]+/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function normalizeLauncher(p) {
      const v = String(p || '').trim().toLowerCase();
      const map = {
        steam: 'steam',
        'steam store': 'steam',
        epic: 'epic',
        'epic games': 'epic',
        'epic games launcher': 'epic',
        gog: 'gog',
        'gog.com': 'gog',
        'gog galaxy': 'gog',
        origin: 'ea',
        'ea app': 'ea',
        'ubisoft connect': 'ubisoft',
        uplay: 'ubisoft',
        'battle.net': 'battlenet',
        battlenet: 'battlenet',
        xbox: 'microsoft',
        'microsoft store': 'microsoft',
        'rockstar games launcher': 'rockstar',
        rockstar: 'rockstar',
        'prime gaming': 'prime',
        'amazon games': 'prime',
        'itch.io': 'itch',
        'drm free': 'drmfree',
        'drm-free': 'drmfree'
      };
      return map[v] || (v ? 'other' : '');
    }

    function launcherLabel(p) {
      const v = String(p || '').trim().toLowerCase();
      const map = {
        steam: 'Steam',
        ea: 'EA App',
        ubisoft: 'Ubisoft Connect',
        gog: 'GOG',
        epic: 'Epic Games Launcher',
        microsoft: 'Microsoft Store',
        battlenet: 'Battle.net',
        rockstar: 'Rockstar Games Launcher',
        prime: 'Prime Gaming',
        itch: 'Itch.io',
        drmfree: 'DRM Free',
        other: 'Other'
      };
      return map[v] || '';
    }

    function launcherBadge(key) {
      const label = launcherLabel(key);
      if (!label) return '';
      const spriteIdMap = {
        steam: 'svg-drm-steam',
        ea: 'svg-drm-ea',
        ubisoft: 'svg-drm-ubisoft-connect',
        gog: 'svg-drm-gog',
        epic: 'svg-drm-epic-games',
        microsoft: 'svg-drm-microsoft-store',
        battlenet: 'svg-drm-battle-net',
        rockstar: 'svg-drm-rockstar',
        prime: 'svg-drm-prime-gaming',
        itch: 'svg-drm-itch-io',
        drmfree: 'svg-drm-drm-free',
        other: 'svg-drm-other'
      };
      const spriteId = spriteIdMap[key];
      const initials = {
        steam: 'S',
        ea: 'EA',
        ubisoft: 'U',
        gog: 'G',
        epic: 'E',
        microsoft: 'M',
        battlenet: 'B',
        rockstar: 'R',
        prime: 'P',
        itch: 'I',
        drmfree: 'D',
        other: 'O'
      }[key] || 'O';
      if (USE_SVG_LAUNCHERS) {
        const href = (DRM_SPRITE_PATH ? (DRM_SPRITE_PATH + '#') : '#') + esc(spriteId || '');
        return '<span class="launcher-icon" data-l="' + esc(key) + '" title="' + esc(label) + '">' +
          '<svg aria-hidden="true"><use href="' + href + '" xlink:href="' + href + '"></use></svg>' +
          '</span>';
      }
      return '<span class="launcher-icon" data-l="' + esc(key) + '" title="' + esc(label) + '">' + esc(initials) + '</span>';
    }

    function isBadPlatform(p) {
      const v = normalizePlatform(p);
      return !v || v === 'link icon' || v.includes('link');
    }

    function gamePlatforms(g) {
      const list = (g && g.platforms && g.platforms.length) ? g.platforms : [];
      return list.filter(p => !isBadPlatform(p));
    }

    function gameLaunchers(g) {
      const list = (g && g.launchers && g.launchers.length) ? g.launchers : [];
      return list;
    }

    function upscaleImage(url) {
      if (!url || url.endsWith('.svg')) return url;
      const match = url.match(/_(\d+)xr(\d+)/);
      if (!match) return url;
      const w = parseInt(match[1], 10);
      const h = parseInt(match[2], 10);
      if (!w || !h) return url;
      return url.replace(/_(\d+)xr(\d+)/, `_${w * 2}xr${h * 2}`);
    }

    function setColumns(count) {
      const grid = document.getElementById('grid-view');
      grid.style.gridTemplateColumns = `repeat(${count}, minmax(0, 1fr))`;
      document.getElementById('cols-value').textContent = count;
    }

    function render(filter) {
      let list = (datasets[currentTab] || []).filter(g => g.name);
      if (activePlatforms.size) {
        list = list.filter(g => gamePlatforms(g).some(p => activePlatforms.has(normalizePlatform(p))));
      }
      if (activeLaunchers.size) {
        list = list.filter(g => gameLaunchers(g).some(p => activeLaunchers.has(normalizeLauncher(p))));
      }
      if (filter) {
        const q = filter.toLowerCase();
        list = list.filter(g => g.name.toLowerCase().includes(q));
      }
      const sorted = sortGames(list);
      updateStats(sorted);

      const grid = document.getElementById('grid-view');
      const noRes = document.getElementById('no-results');

      if (!sorted.length) {
        grid.innerHTML = '';
        noRes.classList.remove('hidden');
        return;
      }
      noRes.classList.add('hidden');

      grid.innerHTML = sorted.map(g => {
        const originalImg = g.image || '';
        const hiRes = upscaleImage(originalImg);
        const isCollection = currentTab === 'collection';
        const launcherIcons = isCollection
          ? '<div class="launcher-row">' + [...new Set(gameLaunchers(g).map(normalizeLauncher).filter(Boolean))].map(launcherBadge).filter(Boolean).join('') + '</div>'
          : '';
        const priceBlock = !isCollection
          ? '<div class="price-text">'+esc(g.price||"N/A")+'</div>'
          : '';
        return '<a class="game-card" href="'+esc(g.url)+'" target="_blank" rel="noopener">' +
        '<img src="'+esc(hiRes)+'" data-fallback="'+esc(originalImg)+'" alt="'+esc(g.name)+'" loading="lazy" ' +
        'onerror="if(this.dataset.fallback){this.src=this.dataset.fallback;this.dataset.fallback=\'\';}">' +
        '<div class="title-overlay">' +
        '<div class="title-text">'+esc(g.name)+'</div>' +
        priceBlock +
        launcherIcons +
        '</div></a>';
      }).join('');
    }

    function buildPlatformList() {
      const list = (datasets[currentTab] || []);
      const platforms = [...new Set(
        list.flatMap(g => gamePlatforms(g)).map(normalizePlatform).filter(Boolean).filter(p => !isBadPlatform(p))
      )].sort();

      const platformListEl = document.getElementById('platform-list');
      platformListEl.innerHTML = platforms.map(p =>
        '<li class=\"nav-item platform-item\">' +
          '<label>' +
            '<input type=\"checkbox\" value=\"' + esc(p) + '\">' +
            '<span>' + esc(platformLabel(p)) + '</span>' +
          '</label>' +
        '</li>'
      ).join('');

      platformListEl.querySelectorAll('input[type=\"checkbox\"]').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) activePlatforms.add(cb.value);
          else activePlatforms.delete(cb.value);
          render(document.getElementById('search').value);
        });
      });
    }

    function buildLauncherList() {
      const list = (datasets[currentTab] || []);
      const ordered = ['steam','ea','ubisoft','gog','epic','microsoft','battlenet','rockstar','prime','itch','drmfree','other'];
      const launchers = [...new Set(
        list.flatMap(g => gameLaunchers(g)).map(normalizeLauncher).filter(Boolean)
      )].sort((a,b) => ordered.indexOf(a) - ordered.indexOf(b));

      const launcherListEl = document.getElementById('launcher-list');
      launcherListEl.innerHTML = launchers.map(p =>
        '<li class=\"nav-item launcher-item\">' +
          '<label>' +
            '<input type=\"checkbox\" value=\"' + esc(p) + '\">' +
            '<span>' + esc(launcherLabel(p)) + '</span>' +
          '</label>' +
        '</li>'
      ).join('');

      launcherListEl.querySelectorAll('input[type=\"checkbox\"]').forEach(cb => {
        cb.addEventListener('change', () => {
          if (cb.checked) activeLaunchers.add(cb.value);
          else activeLaunchers.delete(cb.value);
          render(document.getElementById('search').value);
        });
      });
    }

    function setActiveTab(tab) {
      if (!datasets[tab]) return;
      currentTab = tab;
      activePlatforms.clear();
      activeLaunchers.clear();
      document.querySelectorAll('[data-tab]').forEach(el => {
        el.classList.toggle('active', el.dataset.tab === tab);
      });
      document.getElementById('breadcrumb-label').textContent = tabLabels[tab];
      document.title = `Bibliothèque - ${tabLabels[tab]} (${datasets[tab].length})`;
      buildPlatformList();
      buildLauncherList();

      const launchersSection = document.getElementById('launchers-section');
      const hasLaunchers = (datasets[tab] || []).some(g => (g.launchers || []).length);
      if (launchersSection) launchersSection.style.display = hasLaunchers ? 'block' : 'none';

      render(document.getElementById('search').value);
    }

    const colsRange = document.getElementById('cols-range');
    setColumns(parseInt(colsRange.value, 10));
    colsRange.addEventListener('input', () => {
      setColumns(parseInt(colsRange.value, 10));
    });

    document.getElementById('collection-count').textContent = datasets.collection.length;
    document.getElementById('wishlist-count').textContent = datasets.wishlist.length;

    document.querySelectorAll('[data-tab]').forEach(el => {
      el.addEventListener('click', () => setActiveTab(el.dataset.tab));
    });

    setActiveTab(currentTab);

    const searchInput = document.getElementById('search');
    searchInput.addEventListener('input', e => render(e.target.value));
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        searchInput.value = '';
        render('');
        e.preventDefault();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.defaultPrevented) return;
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      if (document.activeElement === searchInput) return;
      if (document.activeElement && (document.activeElement.isContentEditable || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName))) {
        return;
      }
      if (e.key && e.key.length === 1) {
        searchInput.focus();
        searchInput.value = e.key;
        render(searchInput.value);
        e.preventDefault();
      }
    });

    document.querySelectorAll('[data-sort]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-sort]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentSort = btn.dataset.sort;
        render(document.getElementById('search').value);
      });
    });
  </script>
</body>
</html>
