      border-radius: 8px;
      padding: 12px;

      align-items: center;
      gap: 12px;

      width: 28px;
      height: 28px;

      align-items: center;
      justify-content: center;
      border-radius: 6px;
      background: #fff;
      color: #111;
      border: 1px solid #ccc;
    }
    .icon svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
      color: #111;
    }
    .label {
      font-size: 14px;
    }
  </style>
